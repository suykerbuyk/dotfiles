# PATH for the systemd user manager. Managed by chezmoi.
#
# systemd --user units and .desktop launchers read no shell file at all — not
# ~/.profile, not ~/.zshenv. Anything Hyprland starts, and every user unit
# (ssh-agent.socket among them), inherits its environment from the user manager,
# so this is the only way to reach them.
#
# This is NOT a shell: only VAR=VALUE with $VAR expansion. There are no
# conditionals, so unlike env.sh's path_prepend these entries cannot be skipped
# when the directory is absent. A nonexistent PATH entry is harmless, so the list
# is static — but keep it in step with the path_prepend calls in
# ~/.config/shell/env.sh, and in the same final order (each prepend there pushes
# the previous entry down, so the last one prepended comes first here).
#
# Changes take effect at next login, or on `systemctl --user daemon-reexec`.

PATH=$HOME/code/go/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH
