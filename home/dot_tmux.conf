# ~/.tmux.conf — managed by chezmoi (source: home/dot_tmux.conf)

set-option -g prefix C-b

set-option -g display-panes-time 5001
set-option -g display-time 3000
set-option -g history-limit 20000

# Deterministic default; prefix+m toggles for the rare time you want it.
set-option -g mouse off
bind-key m set-option -gF mouse "#{?mouse,off,on}" \; display-message "#{?mouse,Mouse: ON,Mouse: OFF}"

# --- copy / clipboard -------------------------------------------------------
# One clipboard path: tmux → OSC 52 → outer terminal (Windows Terminal over
# SSH). No xclip/X11 — that cannot work on headless SSH hosts.
set -s set-clipboard external
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Drop legacy xclip binds (source-file does not remove stale key tables).
unbind-key C-p
unbind-key C-y

# vi-style selection in copy-mode (replaces the old -t vi-copy table).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Paste tmux buffer (OSC 52 also feeds the outer clipboard on yank).
bind-key p paste-buffer

# --- pane navigation / resize -----------------------------------------------
unbind-key o
unbind-key space
bind-key space select-pane -t :.+
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r H resize-pane -L 1
bind-key -r L resize-pane -R 1

# --- pane logging (prefix+C-h toggles) --------------------------------------
# Writes to ~/.local/state/tmux/pane-logs/ with consecutive-line dedup and a
# soft ~20 MiB rotate. See ~/.local/bin/tmux-pane-log.
bind-key C-h pipe-pane -o 'exec "$HOME/.local/bin/tmux-pane-log" "#H-#S-#I-#P"' \; \
	display-message "pane-log toggled (#H-#S-#I-#P)"

# --- status -----------------------------------------------------------------
set -g status-bg green
set -g status-fg black
set -g status-left '#[fg=black]#H-#S'
set -g status-left-length 40
set -g status-right '%a %b %d, %Y %H:%M'
set -g window-status-current-format '#I:#P:#D:#W#F'
set-window-option -g automatic-rename off

# Resolve the pane shell at spawn time: prefer zsh, degrade to bash, and never
# silently to bare /bin/sh. Using default-command (not `default-shell ${SHELL}`)
# means a machine where $SHELL names an uninstalled shell — e.g. zsh absent on a
# fresh Debian — still lands panes in a real, configured login shell.
# See ~/.local/bin/preferred-login-shell.
set-option -g default-command 'exec "$HOME/.local/bin/preferred-login-shell"'

# as per neovim/LazyVim checkhealth suggestion
set-option -g focus-events on

# Fixes DCS passthrough as recommended via Grok-CLI
set -g allow-passthrough on

# Fix extended keys as per Grok-CLI recommendations.
set -g extended-keys on

# tmux 3.x defaults escape-time to 10ms. On the path
#   Windows Terminal → WSL2 → ssh → this host's tmux
# replies to tmux's OSC 11 (background colour) and DA queries often arrive later
# than that window. WT's default dark bg is rgb(12,12,12), so you see fragments
# like "11;rgb:0c0c/0c0c/0c0c" leak into the active pane as keystrokes when a
# session is created or split. 100ms is enough for those replies without making
# Esc feel sluggish in vim/nvim.
set -sg escape-time 100
